# Production stack for the Avernek Expense Tracker.
#
# Jenkins installs this file into /srv/deployments/avernek-expense-tracker/ and
# runs it from there with two env files:
#
#   .env              runtime configuration and secrets (operator-owned, mode 600)
#   .deployment.env   APP_IMAGE: the versioned image of the deployed release
#
# It only runs prebuilt images: nothing here refers to the source tree or the
# Jenkins workspace. Manage it with ./deploy-control.sh in the same directory.
#
# The project name and the volume name are deliberately the ones the earlier
# Jenkins deployment created, so its database volume is reused, never replaced.

name: avernek-expense-tracker

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The application's own Postgres. No published port: only services on the
  # internal `backend` network reach it, as host `db`.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_* are read only when the data directory is first initialised;
    # they must match DATABASE_URL. Changing them later renames nothing.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      # postgres:16 keeps its data in /var/lib/postgresql/data (18+ moved it).
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set in .deployment.env}
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM to Node and reaps zombies.
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # "Today" on every page (and in the assistant) is Nepal's date, not UTC's,
      # which is still yesterday until 05:45 in Kathmandu.
      TZ: Asia/Kathmandu
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: Caddy on the host terminates TLS and proxies here.
      # APP_PORT has no default: the operator allocates an unused host port.
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set in .env (an unused host port)}:3000"
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Daily NRB exchange-rate refresh: calls the protected /api/cron/fx route.
  fx-cron:
    image: alpine:3.21
    restart: unless-stopped
    init: true
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set in .env}
      FX_CRON_URL: http://web:3000/api/cron/fx
      FX_CRON_SCHEDULE: ${FX_CRON_SCHEDULE:-0 4 * * *}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # Installed next to this file by the pipeline (and kept with each release).
      - ./bin/fx-cron.sh:/usr/local/bin/fx-cron.sh:ro
    command: ["sh", "/usr/local/bin/fx-cron.sh"]
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # Database traffic only; no route to the internet.
  backend:
    internal: true
  # The app's published port and its outbound calls (the NRB rates API).
  frontend: {}

volumes:
  # Survives restarts, recreation, image replacement and `docker compose down`.
  # Never remove it: it is the database. Named explicitly so a mistyped project
  # name cannot silently create a second, empty database.
  pgdata:
    name: avernek-expense-tracker_pgdata
